# Mask-Guided BBDM f16 Configuration (480 -> 30 latent)
# =====================================================
# Uses learned mask encoding for white/black piece guidance.
# Masks are encoded via SpatialRescaler and concatenated to UNet input.
#
# Directory structure expected:
#   dataset_path/
#   ├── train/
#   │   ├── A/              # Condition images (synthetic)
#   │   ├── B/              # Target images (real)
#   │   ├── A_mask_white/   # White piece masks
#   │   └── A_mask_black/   # Black piece masks
#   ├── val/
#   └── test/
#
# Usage:
#   python -m src.bbdm.main -c src/bbdm/configs/f16_mask_guided_config.yaml -t  # Train
#   python -m src.bbdm.main -c src/bbdm/configs/f16_mask_guided_config.yaml --sample_to_eval  # Evaluate

runner: "MaskGuidedBBDMRunner"

training:
  n_epochs: 150
  n_steps: 200000
  save_interval: 2
  sample_interval: 2
  validation_interval: 2
  accumulate_grad_batches: 4

testing:
  clip_denoised: False
  sample_num: 1

data:
  dataset_name: 'chess_bbdm_mask_guided_f16'
  dataset_type: 'mask_guided_aligned'
  dataset_config:
    dataset_path: null  # Set to local path or null for HF download
    image_size: 256
    channels: 3
    to_normal: True
    flip: False  # Data already augmented
    use_mask_guidance: True
  train:
    batch_size: 30
    shuffle: True
  val:
    batch_size: 8
    shuffle: True
  test:
    batch_size: 8

model:
  model_name: "MGLBBDM-f16"
  model_type: "LBBDM"
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False
  model_load_path: null

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8
    start_ema_step: 30000

  # Mask encoder: 2ch masks -> 2ch latent features
  # n_stages=4 means 256->128->64->32->16 (matches f16 latent size)
  MaskEncoder:
    n_stages: 4
    out_channels: 2

  CondStageParams:
    n_stages: 4
    in_channels: 3
    out_channels: 8

  VQGAN:
    params:
      ckpt_path: "/home/avinoamd/roni/logs/vqgan/2026-02-01T08-14-03/checkpoints/epoch=000008-val/rec_loss=0.1330.ckpt"
      embed_dim: 8
      n_embed: 16384
      ddconfig:
        double_z: false
        z_channels: 8
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: !!python/tuple
          - 1
          - 1
          - 2
          - 2
          - 4
        num_res_blocks: 2
        attn_resolutions:
          - 16
        dropout: 0.0
      lossconfig:
        target: torch.nn.Identity

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear'
      objective: 'grad'
      loss_type: 'l1'

      skip_sample: True
      sample_type: 'linear'
      sample_step: 200

      num_timesteps: 1000
      eta: 1.0
      max_var: 1.0

      UNetParams:
        image_size: 16  # 256/16 = 16 latent size
        in_channels: 10  # 8 (latent) + 2 (mask channels)
        model_channels: 128
        out_channels: 8  # Output only latent channels
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 16
          - 8
          - 4
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "nocond"
