# BBDM Example Configuration
# ===========================
# This is an example config for standard BBDM training (no masks).
# Uses f8 architecture by default.
#
# For masked training, use masked_f8_config.yaml instead.
# For different latent sizes, use f4_config.yaml, f8_config.yaml, or f16_config.yaml.
#
# Usage:
#   python -m src.bbdm.main -c src/bbdm/configs/example_config.yaml -t  # Train
#   python -m src.bbdm.main -c src/bbdm/configs/example_config.yaml --sample_to_eval  # Evaluate

runner: "BBDMRunner"

training:
  n_epochs: 300
  n_steps: 200000
  save_interval: 2
  sample_interval: 2
  validation_interval: 2
  accumulate_grad_batches: 4

testing:
  clip_denoised: False
  sample_num: 1

data:
  dataset_name: 'chess_bbdm'
  # Dataset type options:
  #   - 'custom_aligned': Use with BBDMRunner (no masks, 2-tuple batch)
  #   - 'masked_aligned': Use with MaskedBBDMRunner (requires masks/ folder, 3-tuple batch)
  dataset_type: 'custom_aligned'
  dataset_config:
    # Dataset path options:
    #   - null: Auto-download from HuggingFace (recommended for first run)
    #   - "/path/to/dataset": Use local dataset directory
    #
    # Expected directory structure:
    #   dataset_path/
    #   ├── train/
    #   │   ├── A/          # Condition images (input)
    #   │   └── B/          # Target images (ground truth)
    #   ├── val/
    #   └── test/
    dataset_path: null
    image_size: 256
    channels: 3
    to_normal: True
    flip: True
  train:
    batch_size: 8
    shuffle: True
  val:
    batch_size: 8
    shuffle: True
  test:
    batch_size: 8

model:
  model_name: "LBBDM-chess"
  model_type: "LBBDM"
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False
  
  # BBDM Checkpoint Options:
  #   - null: Train from scratch (default)
  #   - "auto": Download default BBDM checkpoint from HuggingFace
  #   - "auto:bbdm_f8.pth": Download specific checkpoint by name
  #   - "bbdm_chess.pth": Download by filename (short form)
  #   - "/path/to/checkpoint.pth": Load from local file
  # model_load_path: null
  # optim_sche_load_path: null

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8
    start_ema_step: 30000

  CondStageParams:
    n_stages: 3
    in_channels: 3
    out_channels: 4

  VQGAN:
    params:
      # VQGAN Checkpoint Options:
      #   - null: Download default VQGAN (vqgan_f8.ckpt) from HuggingFace
      #   - "vqgan_f8.ckpt": Download specific VQGAN by name
      #   - "/path/to/vqgan.ckpt": Load from local file
      ckpt_path: null
      embed_dim: 4
      n_embed: 16384
      ddconfig:
        double_z: false
        z_channels: 4
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: !!python/tuple
          - 1
          - 2
          - 2
          - 4
        num_res_blocks: 2
        attn_resolutions:
          - 32
        dropout: 0.0
      lossconfig:
        target: torch.nn.Identity

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear'
      objective: 'grad'
      loss_type: 'l1'

      skip_sample: True
      sample_type: 'linear'
      sample_step: 200

      num_timesteps: 1000
      eta: 1.0
      max_var: 1.0

      UNetParams:
        image_size: 32
        in_channels: 4
        model_channels: 128
        out_channels: 4
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 32
          - 16
          - 8
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "nocond"
