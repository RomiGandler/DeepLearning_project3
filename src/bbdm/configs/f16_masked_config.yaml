# Masked BBDM f16 Configuration (256 -> 16 latent)
# ================================================
# Uses mask-weighted loss for focused training on chess piece regions.
# Uses VQGAN with f16 architecture (downsampling factor of 16)
# Latent size: 256/16 = 16x16, z_channels: 8
#
# Directory structure expected:
#   dataset_path/
#   ├── train/
#   │   ├── A/          # Condition images (synthetic)
#   │   ├── B/          # Target images (real)
#   │   └── masks/      # Single-channel masks for loss weighting
#   ├── val/
#   └── test/
#
# Usage:
#   python -m src.bbdm.main -c src/bbdm/configs/f16_masked_config.yaml -t  # Train
#   python -m src.bbdm.main -c src/bbdm/configs/f16_masked_config.yaml --sample_to_eval  # Evaluate

runner: "MaskedBBDMRunner"

training:
  n_epochs: 150
  n_steps: 200000
  save_interval: 2
  sample_interval: 2
  validation_interval: 2
  accumulate_grad_batches: 4

testing:
  clip_denoised: False
  sample_num: 1

data:
  dataset_name: 'chess_bbdm_masked_f16'
  dataset_type: 'masked_aligned'  # MUST use 'masked_aligned' with MaskedBBDMRunner
  dataset_config:
    dataset_path: null  # Set to local path or null for HF download
    image_size: 256
    channels: 3
    to_normal: True
    flip: False  # Data already augmented
    use_masks: True
  train:
    batch_size: 30
    shuffle: True
  val:
    batch_size: 8
    shuffle: True
  test:
    batch_size: 8

model:
  model_name: "MLBBDM-f16"
  model_type: "LBBDM"  # MaskedBBDMRunner uses MaskedLatentBrownianBridgeModel internally
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False
  model_load_path: null

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8
    start_ema_step: 30000

  CondStageParams:
    n_stages: 4
    in_channels: 3
    out_channels: 8

  VQGAN:
    params:
      ckpt_path: "vqgan_f16.ckpt"
      embed_dim: 8
      n_embed: 16384
      ddconfig:
        double_z: false
        z_channels: 8
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: !!python/tuple
          - 1
          - 1
          - 2
          - 2
          - 4
        num_res_blocks: 2
        attn_resolutions:
          - 16
        dropout: 0.0
      lossconfig:
        target: torch.nn.Identity

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear'
      objective: 'grad'
      loss_type: 'l1'

      # Masked loss scale: balance between regular loss and masked loss
      # loss = (1 - scale) * regular_loss + scale * masked_loss
      # Higher values focus more on masked regions (chess pieces)
      masked_loss_scale: 0.75

      skip_sample: True
      sample_type: 'linear'
      sample_step: 200

      num_timesteps: 1000
      eta: 1.0
      max_var: 1.0

      UNetParams:
        image_size: 16  # 256/16 = 16 latent size
        in_channels: 8
        model_channels: 128
        out_channels: 8
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 16
          - 8
          - 4
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "nocond"
