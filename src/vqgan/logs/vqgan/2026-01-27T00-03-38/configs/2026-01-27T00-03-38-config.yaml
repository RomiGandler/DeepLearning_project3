model:
  base_learning_rate: 4.5e-06
  params:
    ckpt: CelebAMaskHQ-f4.ckpt
    embed_dim: 3
    n_embed: 8192
    ddconfig:
      double_z: false
      z_channels: 3
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
    lossconfig:
      target: src.vqgan.model.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_start: 10000
        disc_weight: 0.8
        codebook_weight: 1.0
        disc_num_layers: 3
        perceptual_weight: 1.0
data:
  params:
    batch_size: 2
    num_workers: 8
    train:
      params:
        size: 256
        image_key: both
    validation:
      params:
        size: 256
        image_key: both
    test:
      params:
        size: 256
        image_key: both
training:
  test_only: false
  max_epochs: 100
  gpus: 1
  precision: 32
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  val_check_interval: 1.0
