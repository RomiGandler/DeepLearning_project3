name: chess-proj
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.1+cu121
    - torchvision==0.20.1+cu121
    - ultralytics==8.4.2
    - pytorch-lightning==1.9.5
    - albumentations==1.4.0
    - omegaconf
    - huggingface_hub
    - tensorboard
    - pillow
    - tqdm
    - torchsummary
    - pandas
    - opencv-python