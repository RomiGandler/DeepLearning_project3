[project]
name = "chess-proj"
version = "0.1.0"
description = "Deep Learning Project 3 - Chess"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pillow",
    "numpy",
    "datasets>=4.5.0",
    "huggingface-hub>=1.3.5",
    "ipython>=9.9.0",
    "opencv-python>=4.11.0.86",
    "torchvision>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

